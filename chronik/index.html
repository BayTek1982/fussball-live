<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit Fußball-Chronik</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/chronik-180.png">
<link rel="icon" href="icons/chronik-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080c;--card:#0c1017;--card2:#111723;--line:#1a2130;--txt:#e8edf5;--txt2:#c6cfdd;--mut:#8590a3;--acc:#f5c542;--acct:var(--acc);--hd:rgba(6,8,12,.9);--inset:#05070a;--grid:rgba(255,255,255,.022);--line2:#2a3346;--bk1:#0b1430;--bk2:#060a18;--bkl:#3a4a74;--mbbg:#0f1730;--mbb:#2c3a62;--mbc:#b9c3dc;--sheet:#0b0f16;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
html[data-th="light"]{--bg:#f3f5f9;--card:#ffffff;--card2:#eef1f6;--line:#dce2eb;--txt:#121826;--txt2:#333c4d;--mut:#5b6577;--acct:color-mix(in srgb,var(--acc) 58%,#000);--hd:rgba(243,245,249,.93);--inset:#eef1f6;--grid:rgba(0,0,0,.035);--line2:#cfd6e2;--bk1:#eef3fc;--bk2:#dfe7f6;--bkl:#9fb0d0;--mbbg:#ffffff;--mbb:#c8d3e6;--mbc:#3d4a63;--sheet:#ffffff}
html[data-th="light"] .bt .lb,html[data-th="light"] .bt .arr{color:color-mix(in srgb,var(--c) 60%,#000)}
html[data-th="light"] .bt .em{opacity:.28}
html[data-th="light"] .card,html[data-th="light"] .bt,html[data-th="light"] .yt,html[data-th="light"] .kv>div,html[data-th="light"] .k{box-shadow:0 1px 3px rgba(16,24,40,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif}
body{background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/26px 26px,radial-gradient(900px 420px at 80% -120px,color-mix(in srgb,var(--acc) 14%,transparent),transparent 70%),var(--bg);min-height:100vh;transition:background .3s}
a{color:var(--acct);cursor:pointer;text-decoration:none}
h1,h2,h3{font-family:var(--mono);letter-spacing:-.3px}
h3{font-size:15px;margin:0 0 10px}
header{position:sticky;top:0;z-index:30;background:var(--hd);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1100px;margin:0 auto}
.brand{font:800 15px var(--mono);letter-spacing:.5px;cursor:pointer;white-space:nowrap}
.brand b{color:var(--acct)}.brand i{font-style:normal;color:var(--mut);font-weight:500}
.sbtn{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;width:38px;height:36px;font-size:16px;cursor:pointer}
#sq{display:none;flex:1;min-width:0;background:var(--card);border:1px solid var(--acc);color:var(--txt);border-radius:10px;padding:8px 12px;font:14px var(--mono);outline:none}
body.srch #sq{display:block}body.srch .brand i{display:none}
.crumbs{max-width:1100px;margin:0 auto;padding:0 14px 9px;font:12px var(--mono);color:var(--mut);white-space:nowrap;overflow-x:auto}
.crumbs b{color:var(--txt)}
main{max-width:1100px;margin:0 auto;padding:14px 14px 40px}
.ph{margin:4px 0 14px}.ph h1{margin:4px 0 4px;font-size:25px;line-height:1.15}.ph p{margin:0;color:var(--mut);font-size:13.5px}
.lb{font:700 10.5px var(--mono);letter-spacing:1px;color:var(--acct);text-transform:uppercase}
.lb2{font:700 10.5px var(--mono);letter-spacing:1px;color:var(--mut)}
.lb.sec{margin:16px 0 8px}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.ticker{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;font:600 11px var(--mono);color:var(--mut);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px;scrollbar-width:none}
.ticker b{color:var(--txt)}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.bento{grid-template-columns:repeat(4,1fr)}}
.bt{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:122px;cursor:pointer;transition:.18s}
.bt.big{grid-column:span 2;min-height:142px}
.bt:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--c)}
.bt:after{content:"";position:absolute;inset:0;background:radial-gradient(260px 120px at 100% 100%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%);pointer-events:none}
.bt .lb{color:var(--c)}
.bt .tt{font:800 17px var(--mono);margin-top:8px;line-height:1.15;position:relative;z-index:1}
.bt.big .tt{font-size:22px}
.bt .st{font-size:12px;color:var(--mut);margin-top:8px;position:relative;z-index:1}
.bt .hl{color:var(--txt);font-weight:600}
.bt .em{position:absolute;right:-4px;bottom:-12px;font-size:62px;opacity:.2}
.bt .arr{position:absolute;right:12px;top:10px;font:700 14px var(--mono);color:var(--c)}
.bt:hover,.bt:active{border-color:var(--c);transform:translateY(-2px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.fact{border-left:3px solid var(--acc)}
.kp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--mut)}
.k b{display:block;font:800 18px var(--mono);color:var(--acct)}
.seg{display:flex;gap:4px;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;white-space:nowrap;background:none;border:0;color:var(--mut);font:700 12px var(--mono);padding:9px 10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--acc);color:#0a0a0a}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mut);font:700 11.5px var(--mono);padding:6px 10px;border-radius:999px;cursor:pointer}
.chip.on{color:#0a0a0a;background:var(--acc);border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.yt{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;min-height:104px}
.yt:hover,.yt:active{border-color:var(--acc);box-shadow:0 0 22px -8px var(--acc)}
.yt .y{font:800 24px var(--mono);color:var(--acct);line-height:1}
.yt .h{position:absolute;top:11px;right:11px;font-size:13px}
.yt .w{display:flex;align-items:center;gap:6px;margin-top:10px;font-weight:700;font-size:14px;line-height:1.2}
.yt .bf{font-size:21px}
.yt .s{font:11px var(--mono);color:var(--mut);margin-top:5px}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--card)),var(--card) 60%);border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:18px;padding:16px;margin-bottom:4px}
.champ{display:flex;align-items:center;gap:14px;margin-top:10px;cursor:pointer}
.bigflag{font-size:52px;line-height:1}
.h1{font:800 26px var(--mono);line-height:1.1;margin:2px 0}
.yrnav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 13px;font:700 12.5px var(--mono);cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.sm{padding:6px 10px;font-size:11.5px}.btn.pri{background:var(--acc);color:#0a0a0a;border-color:var(--acc)}
.next{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fin-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:10px}
.fin-row .t{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;cursor:pointer;font-size:14px}
.fin-row .bf{font-size:34px;line-height:1}
.fin-row .sc{font:800 18px var(--mono);background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center;max-width:150px}
.fin-row.big .bf{font-size:46px}.fin-row.big .t{font-size:16px}
.pod{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px}
.pod:last-child{border-bottom:0}.pod .mut{margin-left:auto;font-size:12px}.pod .arr{color:var(--mut)}
.pod .bf{font-size:20px}
.md{min-width:24px;height:24px;padding:0 5px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font:800 11px var(--mono);color:#0a0a0a}
.m1{background:#f5c542}.m2{background:#cfd6dc}.m3{background:#d08a4a}.m4{background:#3a4559;color:#fff}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kv>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px}
.kv span{font:700 10px var(--mono);color:var(--mut);letter-spacing:.6px;text-transform:uppercase}
.kv b{font-size:14px}.kv i{font-style:normal;color:var(--acct);font:600 12px var(--mono)}
.note{background:color-mix(in srgb,var(--acc) 8%,transparent);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.yr{display:inline-block;font:700 11.5px var(--mono);background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:3px 7px;margin:2px 1px;color:var(--txt)}
a.yr:hover{border-color:var(--acc)}.yr.cur{background:var(--acc);color:#0a0a0a;border-color:var(--acc)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:136px 1fr 30px;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t{height:12px;background:var(--inset);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;width:0;background:var(--acc);transition:width .8s}
.bar .n{font:800 14px var(--mono);text-align:right;color:var(--acct)}
.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font:700 10px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tb tr[data-go]{cursor:pointer}.tb tr:hover td{background:rgba(255,255,255,.02)}
.tb td.y{font:800 14px var(--mono);color:var(--acct);white-space:nowrap}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.mrow:last-child{border-bottom:0}.mrow .a{text-align:right;font-weight:700}.mrow .b{color:var(--mut)}
.mrow .sc{font:700 12px var(--mono);background:var(--inset);border:1px solid var(--line);border-radius:7px;padding:3px 7px;white-space:nowrap}
.mrow .inf{grid-column:1/-1;text-align:center;font:11px var(--mono);color:var(--mut);margin-top:-3px}
.mrow.mini{font-size:12px}
.mrow .a.n{font-weight:500;color:var(--mut)}.mrow .b.w{font-weight:700;color:var(--txt)}
.gd summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}.gd summary::-webkit-details-marker{display:none}.gd[open] summary{margin-bottom:6px}
.ghd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.gt th{font:700 9.5px var(--mono);color:var(--mut);text-align:left;padding:4px}
.gt td{padding:6px 4px;border-top:1px solid var(--line)}.gt tr{cursor:pointer}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line2)}.dot.q{background:var(--acc)}.dot.q3{background:color-mix(in srgb,var(--acc) 45%,var(--line2))}
.bkcard{padding:10px}
.bktools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.bkw{overflow-x:auto;overflow-y:hidden;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 16%,transparent),transparent),linear-gradient(160deg,var(--bk1),var(--bk2));border-radius:12px;border:1px solid var(--line)}
.bk{position:relative}
.bk svg{position:absolute;left:0;top:0}.bk path{fill:none;stroke:var(--bkl);stroke-width:1.6}
.mb{position:absolute;width:34px;background:var(--mbbg);border:1px solid var(--mbb);border-radius:8px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mb:hover{border-color:var(--acc)}
.tm{height:29px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tm+.tm{border-top:1px solid var(--mbb)}
.tm .f{font-size:17px}.tm .c{font:700 7.5px var(--mono);color:var(--mbc);margin-top:2px}
.tm.lose{opacity:.33;filter:grayscale(.7)}
.mb.fin{flex-direction:row;border:1.5px solid var(--acc);box-shadow:0 0 22px -4px var(--acc)}
.mb.fin .tm{flex:1;height:100%}.mb.fin .tm+.tm{border-top:0;border-left:1px solid var(--mbb)}.mb.fin .f{font-size:22px}
.mb.p3{border-color:#d08a4a;box-shadow:none}
.rl{position:absolute;top:4px;text-align:center;font:800 10px var(--mono);color:var(--acct)}
.cup{position:absolute;text-align:center;font-size:46px;filter:drop-shadow(0 0 14px rgba(245,197,66,.55))}
.fsc{position:absolute;text-align:center;font:800 9.5px var(--mono);color:var(--txt)}
.p3l{position:absolute;text-align:center;font:700 9px var(--mono);color:#d08a4a}
.list{display:grid;gap:8px}
.card.row{display:flex;align-items:center;gap:12px;margin:0;cursor:pointer}
.card.row .y{font:800 15px var(--mono);color:var(--acct);min-width:46px}.card.row .arr{margin-left:auto;color:var(--mut)}
.rek{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rek .card{margin:0}
.val{font:800 21px var(--mono);color:var(--acct);margin:4px 0;line-height:1.15}
.lex summary{font:800 15px var(--mono);cursor:pointer;color:var(--txt)}.lex p{margin:8px 0 0;color:var(--txt2)}.lex{margin:0}
.quiz .opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer}
.quiz .opt.ok{background:#16a34a;border-color:#22c55e;color:#fff}.quiz .opt.no{background:#dc2626;border-color:#ef4444;color:#fff}
.prog{height:5px;background:var(--inset);border-radius:5px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--acc)}
.res{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.res small{color:var(--mut)}
.tag{display:inline-block;font:700 10px var(--mono);border:1px solid var(--acc);color:var(--acct);border-radius:6px;padding:1px 6px;margin-right:6px}
.psec{margin-top:14px}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
#sheet.open{opacity:1;pointer-events:auto}
#sheet .sp{width:100%;max-width:640px;max-height:86vh;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:16px 16px 28px;transform:translateY(30px);transition:.2s;position:relative}
#sheet.open .sp{transform:none}
#sheet .x{position:sticky;top:0;float:right;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;width:34px;height:32px;cursor:pointer;z-index:2}
.grip{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:-6px auto 10px}
.thg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.thb{background:var(--card2);border:2px solid var(--line);color:var(--txt);border-radius:14px;padding:14px 6px;font:800 13px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.thb span{font-size:26px}.thb.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent)}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
.sw button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.sw button.on{border-color:var(--txt);transform:scale(1.08)}
.sw input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card2);padding:2px;cursor:pointer}
.tgl{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0 4px;cursor:pointer}.tgl input{width:20px;height:20px;accent-color:var(--acc)}
.sbtn+.sbtn{margin-left:0}
footer{max-width:1100px;margin:0 auto;padding:0 14px 30px;color:var(--mut);font:11px var(--mono);text-align:center}
@media(max-width:600px){.hm{display:none}.bar{grid-template-columns:118px 1fr 26px}.h1{font-size:22px}.bigflag{font-size:44px}.ph h1{font-size:21px}}
</style>
</head>
<body>
<header>
 <div class="bar1"><div class="brand" data-go="">⚽ <b>FUSSBALL</b><i>//CHRONIK</i></div><input id="sq" type="search" placeholder="Verein, Spieler, Land, Jahr …" autocomplete="off"><button class="sbtn" id="sbtn" aria-label="Suche">🔎</button><button class="sbtn" id="tbtn" aria-label="Darstellung">🎨</button></div>
 <div class="crumbs" id="crumbs"></div>
</header>
<main id="app"></main>
<div id="sheet"><div class="sp"><button class="x" data-close>✕</button><div class="grip"></div><div class="sb"></div></div></div>
<footer>Daten bis Saison 2025/26 · WM 2026 · Ballon d'Or 2026 — n.V. = nach Verlängerung · i.E. = im Elfmeterschießen</footer>
<script>

/* ================== HILFEN: FLAGGEN ================== */
const NAT={Uruguay:"UY",Argentinien:"AR",Italien:"IT",Tschechoslowakei:"CZ",Deutschland:"DE",Österreich:"AT",Ungarn:"HU",Brasilien:"BR",Schweden:"SE",Spanien:"ES",Frankreich:"FR",England:"ENG",Portugal:"PT",Sowjetunion:"SU",Niederlande:"NL",Polen:"PL",Belgien:"BE",Kroatien:"HR",Türkei:"TR",Südkorea:"KR",Japan:"JP",USA:"US",Kanada:"CA",Mexiko:"MX",Marokko:"MA",Jugoslawien:"YU",Chile:"CL",Schweiz:"CH",Dänemark:"DK",Griechenland:"GR",Tschechien:"CZ",Russland:"RU",Wales:"WAL",Island:"IS",Bulgarien:"BG",Rumänien:"RO",Irland:"IE",Kamerun:"CM",Kolumbien:"CO","Costa Rica":"CR",Senegal:"SN",Ghana:"GH",Paraguay:"PY",Ukraine:"UA",Nordirland:"NIR",Nordkorea:"KP",Peru:"PE",Bolivien:"BO",Schottland:"SCO",Liberia:"LR",Norwegen:"NO",Südafrika:"ZA",Katar:"QA",Georgien:"GE",Ecuador:"EC",China:"CN",Europa:"EU",Serbien:"RS",Slowakei:"SK"};
const CODE2NAME={};for(const k in NAT)if(!CODE2NAME[NAT[k]])CODE2NAME[NAT[k]]=k;CODE2NAME.CZ="Tschechien";CODE2NAME.RS="Serbien";
const CLUB={
ES:["Real Madrid","FC Barcelona","Atlético Madrid","FC Valencia","FC Sevilla","Espanyol Barcelona","Athletic Bilbao","Deportivo Alavés","FC Villarreal","Real Betis","Rayo Vallecano","Real Saragossa"],

function buildTree(o){
  const names=["r32","r16","qf","sf"].filter(k=>o[k]&&o[k].length);if(!names.length)return null;
  const rounds=names.map(k=>o[k]);
  const b=(team,ri)=>{if(ri<0)return{leaf:team};const m=rounds[ri].find(x=>x[0]===team);if(!m)return{leaf:team};return{m,rk:names[ri],a:b(m[0],ri-1),b:b(m[1],ri-1)}};
  return{D:names.length,names,L:b(o.w,names.length-1),R:b(o.f,names.length-1)};
}
const RN={r32:"1/16",r16:"1/8",qf:"1/4",sf:"1/2"},RNL={g:"Gruppenspiel",r32:"Sechzehntelfinale",r16:"Achtelfinale",qf:"Viertelfinale",sf:"Halbfinale",p3:"Spiel um Platz 3",f:"Finale"};

function bracketHTML(o){

  const L=Math.pow(2,D-1);

  const x0=D*st,xl=c=>c*st,xr=c=>x0+fw+gx+(D-1-c)*st,W=xr(0)+bw;
  const P=(x1,y1,x2,y2)=>{const xm=(x1+x2)/2;return `<path d="M${x1} ${y1}H${xm}V${y2}H${x2}"/>`};
  let boxes="",lines="";
  function lay(n,c,side,cnt){
    let y;
    if(c===0||!n.a||!n.a.m||!n.b.m){const sp=Math.pow(2,c);y=t0+(cnt.k+sp/2)*rh-4;cnt.k+=sp}
    else{const ya=lay(n.a,c-1,side,cnt),yb=lay(n.b,c-1,side,cnt);y=(ya+yb)/2;
      [ya,yb].forEach(yy=>{lines+=side==="L"?P(xl(c-1)+bw,yy,xl(c),y):P(xr(c-1),yy,xr(c)+bw,y)})}
    const x=side==="L"?xl(c):xr(c);
    boxes+=`<div class="mb" style="left:${x}px;top:${y-bh/2}px" data-mi="${regM(n.m,n.rk)}">${chip(n.m[0],1)}${chip(n.m[1],0)}</div>`;
    return y;
  }
  const yL=lay(T.L,D-1,"L",{k:0}),yR=lay(T.R,D-1,"R",{k:0}),fy=(yL+yR)/2;
  lines+=P(xl(D-1)+bw,yL,x0,fy)+P(xr(D-1),yR,x0+fw,fy);
  let lab="";for(let c=0;c<D;c++){lab+=`<div class="rl" style="left:${xl(c)}px;width:${bw}px">${RN[T.names[c]]}</div><div class="rl" style="left:${xr(c)}px;width:${bw}px">${RN[T.names[c]]}</div>`}
  lab+=`<div class="rl" style="left:${x0}px;width:${fw}px">F</div>`;
  const fin=`<div class="mb fin" style="left:${x0}px;top:${fy-fh/2}px;width:${fw}px;height:${fh}px" data-mi="${regM([o.w,o.f,o.s,o.fi],"f")}">${chip(o.w,1)}${chip(o.f,0)}</div><div class="cup" style="left:${x0}px;width:${fw}px;top:${fy-fh/2-62}px">🏆</div><div class="fsc" style="left:${x0-20}px;width:${fw+40}px;top:${fy+fh/2+4}px">${esc(o.s)}</div>`;
  let p3="";if(isP3(o)){const py=fy+fh/2+44;p3=`<div class="p3l" style="left:${x0-30}px;width:${fw+60}px;top:${py-16}px">Spiel um Platz 3</div><div class="mb fin p3" style="left:${x0}px;top:${py}px;width:${fw}px;height:${fh}px" data-mi="${regM([o.p3,o.p4,o.p3s,o.p3i],"p3")}">${chip(o.p3,1)}${chip(o.p4,0)}</div>`;H=Math.max(H,py+fh+8)}

}

 ()=>{const o=pick(CL);return[`Wer gewann ${o.y} den Landesmeister-Pokal / die Champions League?`,o.w,[...new Set(CL.map(x=>x.w))]]},
 ()=>{const o=pick(CL);return[`Wo fand das CL-/Landesmeister-Finale ${o.y} statt?`,o.o,[...new Set(CL.map(x=>x.o))]]},
 ()=>{const o=pick(EL);return[`Wer gewann ${o.y} den UEFA-Pokal / die Europa League?`,o.w,[...new Set(EL.map(x=>x.w))]]},
 ()=>{const o=pick(BDO);return[`Wer gewann ${o.y} den Ballon d'Or?`,o.p,[...new Set(BDO.map(x=>x.p))]]},
 ()=>{const o=pick(BL);return[`Wer wurde ${o.y} Deutscher Meister?`,o.w,[...new Set(BL.map(x=>x.w))]]},
 ()=>{const o=pick(BL.filter(x=>!x.ts.includes("&")));return[`Wer war ${o.y} Bundesliga-Torschützenkönig?`,o.ts.replace(/\s*\(.*\)/,""),[...new Set(BL.filter(x=>!x.ts.includes("&")).map(x=>x.ts.replace(/\s*\(.*\)/,"")))]]},
 ()=>{const o=pick(POKAL);return[`Wer gewann ${o.y} den DFB-Pokal?`,o.w,[...new Set(POKAL.map(x=>x.w))]]},
 ()=>{const r=pick(REK);return[`${r[1]}?`,r[2],REK.map(x=>x[2])]}];
 const[q,an,pool]=pick(gens)();return{q,a:an,opts:shuffle([an,...shuffle([...new Set(pool)].filter(x=>x!==an)).slice(0,3)])}}
function hsGet(){try{return +localStorage.getItem("fc_hs")||0}catch(e){return 0}}
function hsSet(v){try{localStorage.setItem("fc_hs",v)}catch(e){}}
let QZ=null;
V.quiz=a=>{crumb([[a.t,null]]);app.innerHTML=ph(a,a.t,"10 zufällige Fragen aus der ganzen Chronik – jedes Mal neu")+`<div class="card quiz" id="qz"></div>`;QZ={i:0,p:0,qs:Array.from({length:10},mkQ)};qShow()};
function qShow(){const el=document.getElementById("qz");if(!el)return;
  if(QZ.i>=10){const hs=Math.max(hsGet(),QZ.p);hsSet(hs);const msg=QZ.p===10?"Perfekt – echter Fußball-Experte! 🏆":QZ.p>=7?"Stark – fast Weltmeister-Niveau! 💪":QZ.p>=4?"Gut gemacht – da geht noch mehr! ⚽":"Weiter üben – die Chronik hilft dir! 📖";
    el.innerHTML=`<div style="text-align:center;padding:10px"><div style="font-size:50px">🏆</div><div class="val">${QZ.p} / 10</div><p>${msg}</p><p class="mut">Dein Rekord: ${hs} Punkte</p><button class="btn pri" id="qa">Nochmal spielen</button></div>`;document.getElementById("qa").onclick=()=>V.quiz(A.quiz);return}
  const q=QZ.qs[QZ.i];el.dataset.lock="0";
  el.innerHTML=`<div class="lb">// FRAGE ${QZ.i+1} VON 10 · PUNKTE ${QZ.p} · REKORD ${hsGet()}</div><div class="prog"><i style="width:${QZ.i*10}%"></i></div><h3 style="font-size:19px;margin:12px 0">${esc(q.q)}</h3>${q.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${fl(o)}${esc(o)}</button>`).join("")}<div id="qn"></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(el.dataset.lock==="1")return;el.dataset.lock="1";const ok=b.dataset.o===q.a;if(ok)QZ.p++;
    el.querySelectorAll(".opt").forEach(x=>{if(x.dataset.o===q.a)x.classList.add("ok");else if(x===b)x.classList.add("no")});
    document.getElementById("qn").innerHTML=`<p><b>${ok?"✅ Richtig!":"❌ Leider falsch – richtig: "+esc(q.a)}</b></p><button class="btn pri" id="qx">${QZ.i===9?"Ergebnis anzeigen":"Nächste Frage →"}</button>`;
    document.getElementById("qx").onclick=()=>{QZ.i++;qShow()}})}

/* ================== PROFIL (Verein / Land) ================== */
function yrs(list,h){return list.map(y=>h?`<a class="yr" data-go="${h(y)}">${y}</a>`:`<span class="yr">${y}</span>`).join(" ")}
function profile(name){
  const S=[];const add=(t,list,h)=>{if(list.length)S.push(`<div class="psec"><div class="lb">// ${t} · ${list.length}×</div><div class="sm">${yrs(list,h)}</div></div>`)};
  const isNat=!!NAT[name]&&!CLUBMAP[name];
  if(isNat){
    add("WELTMEISTER",WM.filter(o=>o.w===name).map(o=>o.y),y=>"wm-"+y);
    add("WM-FINALE VERLOREN",WM.filter(o=>o.f===name).map(o=>o.y),y=>"wm-"+y);
    add("WM-PLATZ 3",WM.filter(o=>o.p3===name&&o.p3s!=="HF").map(o=>o.y),y=>"wm-"+y);
    add("WM-GASTGEBER",WM.filter(o=>o.h.includes(name)).map(o=>o.y),y=>"wm-"+y);
    add("EUROPAMEISTER",EM.filter(o=>o.w===name).map(o=>o.y),y=>"em-"+y);
    add("EM-FINALE VERLOREN",EM.filter(o=>o.f===name).map(o=>o.y),y=>"em-"+y);
    add("EM-HALBFINALE / PLATZ 3",EM.filter(o=>o.p3===name||o.p4===name).map(o=>o.y),y=>"em-"+y);
    add("COPA AMÉRICA",COPA.filter(o=>o.w===name).map(o=>o.y));
    WEITERE.filter(w=>w.nat).forEach(w=>add(w.t.toUpperCase(),w.d.filter(o=>o.w===name).map(o=>o.y),()=>"weitere-"+w.id));
    add("BALLON D'OR",BDO.filter(o=>o.n===name).map(o=>o.y+" "+o.p));
    const ko=[];WM.forEach(o=>["r32","r16","qf","sf"].forEach(k=>(o[k]||[]).forEach(m=>{if(m[0]===name||m[1]===name)ko.push([o.y,k,m])})));
    if(ko.length){const w=ko.filter(x=>x[2][0]===name).length;S.push(`<div class="psec"><div class="lb">// WM-K.-O.-SPIELE IN DER CHRONIK · ${w} SIEGE / ${ko.length-w} NIEDERLAGEN</div>${ko.slice().reverse().slice(0,12).map(([y,k,m])=>`<div class="mrow mini" data-go="wm-${y}"><div class="a">${y} ${RN[k]}</div><div class="sc">${esc(m[2])}</div><div class="b">${m[0]===name?"✅ gegen "+esc(m[1]):"❌ gegen "+esc(m[0])}</div></div>`).join("")}</div>`)}
  } else {
    [["CHAMPIONS LEAGUE",CL,"cl"],["EUROPA LEAGUE / UEFA-POKAL",EL,"el"],["CONFERENCE LEAGUE",ECL,"ecl"]].forEach(([t,D,id])=>{add(t,D.filter(o=>o.w===name).map(o=>o.y),y=>id+"-"+y);add(t+" – FINALE VERLOREN",D.filter(o=>o.f===name).map(o=>o.y),y=>id+"-"+y)});
    WEITERE.filter(w=>!w.nat).forEach(w=>add(w.t.toUpperCase(),w.d.filter(o=>o.w===name).map(o=>o.y),()=>"weitere-"+w.id));
    add("DEUTSCHER MEISTER (BUNDESLIGA)",BL.filter(o=>o.w===name).map(o=>o.y),y=>"bundesliga-"+keyOf(y));
    add("DFB-POKAL",POKAL.filter(o=>o.w===name).map(o=>o.y),y=>"pokal-"+y);
    add("DFB-POKAL – FINALE VERLOREN",POKAL.filter(o=>o.f===name).map(o=>o.y),y=>"pokal-"+y);
    const lg=[];Object.entries(LIGEN).forEach(([k,x])=>x.forEach((w,i)=>{if(w===name)lg.push(LIGEN_J[i])}));add("LANDESMEISTER (LETZTE 10 JAHRE)",lg,()=>"ligen");
    add("BALLON-D'OR-SIEGER IM VEREIN",BDO.filter(o=>o.c===name).map(o=>o.y+" "+o.p));
  }
  const tot=S.length;
  openSheet(`<div class="lb">// ${isNat?"LÄNDERPROFIL":"VEREINSPROFIL"}</div><div class="champ"><span class="bigflag">${fo(name)||"🛡️"}</span><div class="h1">${esc(name)}</div></div>${tot?S.join(""):`<p class="mut">Für ${esc(name)} sind in dieser Chronik keine weiteren Titel erfasst.</p>`}`);
}

/* ================== SHEET ================== */
function openSheet(html){const s=document.getElementById("sheet");s.querySelector(".sb").innerHTML=html;s.classList.add("open");document.body.style.overflow="hidden"}
function closeSheet(){const s=document.getElementById("sheet");s.classList.remove("open");document.body.style.overflow=""}
function matchSheet(i){const {m,rk}=MATCHES[i];
  openSheet(`<div class="lb">// ${RNL[rk].toUpperCase()}</div><div class="fin-row big"><div class="t" data-pr="${esc(m[0])}"><span class="bf">${fo(m[0])}</span><b>${esc(m[0])}</b><span class="mut sm">${rk==="g"?(m[4]==="h"?"Sieg":m[4]==="a"?"Niederlage":"Remis"):rk==="p3"?"Platz 3":rk==="f"?"Sieger":"weiter"}</span></div><div class="sc">${esc(m[2]||"–")}</div><div class="t" data-pr="${esc(m[1])}"><span class="bf">${fo(m[1])}</span><span>${esc(m[1])}</span><span class="mut sm">${rk==="g"?(m[4]==="a"?"Sieg":m[4]==="h"?"Niederlage":"Remis"):rk==="p3"?"Platz 4":rk==="f"?"Finalist":"ausgeschieden"}</span></div></div>${m[3]?`<p class="mut sm" style="text-align:center">📅 ${esc(m[3])}</p>`:""}<div class="next"><button class="btn" data-pr="${esc(m[0])}">${fo(m[0])} Profil ${esc(m[0])}</button><button class="btn" data-pr="${esc(m[1])}">${fo(m[1])} Profil ${esc(m[1])}</button></div>`)}

/* ================== KLICKS ================== */
document.addEventListener("click",e=>{
  const sh=document.getElementById("sheet");
  if(e.target.closest("[data-close]")||e.target===sh){closeSheet();return}
  const gk=e.target.closest("[data-gk]");if(gk&&CUR_T&&CUR_T.gm){const L=gk.dataset.gk;openSheet(`<div class="lb">// ${esc((/^[A-L]$/.test(L)?"Gruppe "+L:L).toUpperCase())} · ALLE SPIELE</div>${CUR_T.gm[L].map(gmrow).join("")}`);return}
  const mi=e.target.closest("[data-mi]");if(mi){matchSheet(+mi.dataset.mi);return}
  const pr=e.target.closest("[data-pr]");if(pr&&pr.dataset.pr){profile(pr.dataset.pr);return}
  const t=e.target.closest("[data-tab]");if(t){TAB[t.parentElement.dataset.seg]=t.dataset.tab;render();return}
  const tg=e.target.closest("[data-tab-go]");if(tg){const sg=document.querySelector("[data-seg]");TAB[sg.dataset.seg]=tg.dataset.tabGo;render();return}
  const g=e.target.closest("[data-go]");if(g){closeSheet();go(g.dataset.go);return}
});

/* ================== SUCHE ================== */
const IDX=[];
WM.forEach(o=>IDX.push({h:"wm-"+o.y,tag:"WM",t:`WM ${o.y}: ${o.w} – ${o.f} ${o.s}`,d:`${o.h} · Platz 3: ${o.p3} · Torschützenkönig: ${o.ts}${o.bp?" · Bester Spieler: "+o.bp:""}`}));
WM.forEach(o=>["r32","r16","qf","sf"].forEach(k=>(o[k]||[]).forEach(m=>IDX.push({h:"wm-"+o.y,tag:"WM-Spiel",t:`WM ${o.y} ${RNL[k]}: ${m[0]} – ${m[1]} ${m[2]}`,d:m[3]||""}))));
EM.forEach(o=>IDX.push({h:"em-"+o.y,tag:"EM",t:`EM ${tourLabel(o)}: ${o.w} – ${o.f} ${o.s}`,d:`${o.h} · ${o.p3}, ${o.p4} · Torschützenkönig: ${o.ts}`}));
[[CL,"cl","CL"],[EL,"el","EL"],[ECL,"ecl","ECL"]].forEach(([D,id,tg])=>D.forEach(o=>IDX.push({h:id+"-"+o.y,tag:tg,t:`${o.y}: ${o.w} – ${o.f} ${o.s}`,d:o.o!=="–"?"Finale in "+o.o:"Hin- & Rückspiel"})));
BDO.forEach(o=>IDX.push({h:"ballon-"+o.y,tag:"Ballon d'Or",t:`${o.y}: ${o.p}`,d:`${o.n} · ${o.c}`}));
BL.forEach(o=>IDX.push({h:"bundesliga-"+keyOf(o.y),tag:"Bundesliga",t:`${o.y}: Meister ${o.w}`,d:`Torschützenkönig: ${o.ts} – ${o.tg} Tore`}));
POKAL.forEach(o=>IDX.push({h:"pokal-"+o.y,tag:"DFB-Pokal",t:`${o.y}: ${o.w}`,d:o.f?`Finale ${o.s} gegen ${o.f}`:""}));
COPA.forEach(o=>IDX.push({h:"copa",tag:"Copa",t:`${o.y}: ${o.w}`,d:"Copa América"}));
WEITERE.forEach(w=>w.d.forEach(o=>IDX.push({h:"weitere-"+w.id,tag:w.t.split(" (")[0],t:`${o.y}: ${o.w}`,d:o.f?`Finale ${o.s} gegen ${o.f}`:""})));
REK.forEach(r=>IDX.push({h:"rekorde",tag:"Rekord",t:`${r[1]}: ${r[2]}`,d:r[3]}));
const sq=document.getElementById("sq");
document.getElementById("sbtn").onclick=()=>{document.body.classList.toggle("srch");if(document.body.classList.contains("srch"))sq.focus();else render()};
sq.addEventListener("input",()=>{const v=sq.value.toLowerCase().trim();if(!v){render();return}
  const words=v.split(/\s+/),res=IDX.filter(e=>{const s=(e.tag+" "+e.t+" "+e.d).toLowerCase();return words.every(w=>s.includes(w))});
  setAcc("#f5c542");crumbs.innerHTML=`<a data-go="">⌂ start</a> <span>›</span> <b>Suche</b>`;
  app.innerHTML=`<div class="ph"><div class="lb">// SUCHE · ${res.length} TREFFER</div><h1>„${esc(sq.value)}“</h1></div><div class="card" style="padding:4px 0">${res.slice(0,300).map(e=>`<div class="res" data-go="${e.h}"><span class="tag">${esc(e.tag)}</span><b>${esc(e.t)}</b><br><small>${esc(e.d)}</small></div>`).join("")||`<p class="mut" style="padding:12px">Nichts gefunden – versuch einen anderen Begriff.</p>`}</div>`});

/* ================== DARSTELLUNG (Dunkel / Hell / Eigene) ================== */
const TH=(()=>{const d={mode:"custom",bg:"#111111",acc:"#f5c542",useArea:true};try{return Object.assign(d,JSON.parse(localStorage.getItem("fc_theme")||"{}"))}catch(e){return d}})();
function thSave(){try{localStorage.setItem("fc_theme",JSON.stringify(TH))}catch(e){}}
const hx=h=>{h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const toHex=a=>"#"+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))};
const lum=h=>{const[r,g,b]=hx(h);return(0.299*r+0.587*g+0.114*b)/255};
const CVARS=["--bg","--card","--card2","--line","--txt","--txt2","--mut","--hd","--inset","--grid","--line2","--bk1","--bk2","--bkl","--mbbg","--mbb","--mbc","--sheet"];
function applyTheme(){
  const R=document.documentElement;CVARS.forEach(v=>R.style.removeProperty(v));
  if(TH.mode==="custom"){
    const b=TH.bg,dark=lum(b)<0.55,W="#ffffff",K="#000000";R.dataset.th=dark?"dark":"light";
    const V=dark?{"--bg":b,"--card":mix(b,W,.05),"--card2":mix(b,W,.09),"--line":mix(b,W,.13),"--txt":"#eef2f8","--txt2":"#cdd5e2","--mut":mix(b,W,.55),"--inset":mix(b,K,.3),"--grid":"rgba(255,255,255,.03)","--line2":mix(b,W,.18),"--bk1":mix(b,W,.06),"--bk2":mix(b,K,.25),"--bkl":mix(b,W,.3),"--mbbg":mix(b,W,.08),"--mbb":mix(b,W,.22),"--mbc":"#d5dcea","--sheet":mix(b,W,.04)}
      :{"--bg":b,"--card":mix(b,W,.75),"--card2":mix(b,W,.45),"--line":mix(b,K,.12),"--txt":"#121826","--txt2":"#333c4d","--mut":mix(b,K,.55),"--inset":mix(b,W,.4),"--grid":"rgba(0,0,0,.04)","--line2":mix(b,K,.18),"--bk1":mix(b,W,.6),"--bk2":mix(b,W,.3),"--bkl":mix(b,K,.3),"--mbbg":"#ffffff","--mbb":mix(b,K,.2),"--mbc":"#3d4a63","--sheet":mix(b,W,.85)};
    const[r,g,bl]=hx(b);V["--hd"]=`rgba(${r},${g},${bl},.93)`;
    Object.entries(V).forEach(([k,v])=>R.style.setProperty(k,v));
  } else R.dataset.th=TH.mode;
  document.getElementById("tbtn").textContent=TH.mode==="dark"?"🌙":TH.mode==="light"?"☀️":"🎨";
}
const BGS=[["#ffffff","Weiß"],["#f4efe6","Sand"],["#e8eef7","Hellblau"],["#d9dee6","Hellgrau"],["#3b4252","Schiefer"],["#1e2a3a","Nachtblau"],["#2b1f33","Pflaume"],["#111111","Schwarz"]];
const ACCS=["#f5c542","#ff4d5e","#4c8dff","#22c55e","#9b8cff","#ff8a3d","#2dd4bf","#f472b6"];
function themeSheet(){
  openSheet(`<div class="lb">// DARSTELLUNG</div><h3 style="font-size:20px;margin:6px 0 0">Wie soll die App aussehen?</h3>
  <div class="thg">${[["dark","🌙","Dunkel"],["light","☀️","Hell"],["custom","🎨","Eigene"]].map(([m,i,l])=>`<button class="thb ${TH.mode===m?"on":""}" data-thm="${m}"><span>${i}</span>${l}</button>`).join("")}</div>
  ${TH.mode==="custom"?`<div class="lb">// HINTERGRUND</div><div class="sw">${BGS.map(([c,n])=>`<button title="${n}" style="background:${c}" class="${TH.bg===c?"on":""}" data-bg="${c}"></button>`).join("")}<input type="color" id="cbg" value="${TH.bg}" title="Eigene Farbe"></div>
  <div class="lb">// AKZENTFARBE</div><label class="tgl"><input type="checkbox" id="cua" ${TH.useArea?"checked":""}> Jeder Bereich behält seine eigene Farbe</label>
  ${TH.useArea?"":`<div class="sw">${ACCS.map(c=>`<button style="background:${c}" class="${TH.acc===c?"on":""}" data-ac="${c}"></button>`).join("")}<input type="color" id="cac" value="${TH.acc}" title="Eigene Farbe"></div>`}
  <p class="mut sm">Tipp: Wähle ein Feld – oder tippe auf das große Farbfeld rechts für jede beliebige Farbe. Bei hellen Farben wird die Schrift automatisch dunkel.</p>`:`<p class="mut sm">Mit „Eigene“ wählst du Hintergrund und Akzentfarbe selbst.</p>`}`);
  const sb=document.querySelector("#sheet .sb");
  const upd=re=>{thSave();applyTheme();render2();if(re)themeSheet()};
  sb.querySelectorAll("[data-thm]").forEach(b=>b.onclick=()=>{TH.mode=b.dataset.thm;upd(1)});
  sb.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{TH.bg=b.dataset.bg;upd(1)});
  sb.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{TH.acc=b.dataset.ac;upd(1)});
  const cbg=sb.querySelector("#cbg");if(cbg)cbg.oninput=()=>{TH.bg=cbg.value;upd(0)};
  const cac=sb.querySelector("#cac");if(cac)cac.oninput=()=>{TH.acc=cac.value;upd(0)};
  const cua=sb.querySelector("#cua");if(cua)cua.onchange=()=>{TH.useArea=cua.checked;upd(1)};
}
function render2(){const r=route();const a=A[r.p];setAcc(r.p==="home"?"#f5c542":a?a.col:"#f5c542")}
document.getElementById("tbtn").onclick=themeSheet;
applyTheme();

render();
</script>
