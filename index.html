<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<title>Bayazit Fußball-Ergebnisse</title>
<link rel="icon" type="image/svg+xml" href="icons/fussball.svg">
<link rel="apple-touch-icon" href="icons/fussball-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("fe_theme")==="light")document.documentElement.dataset.th="light"}catch(e){}</script>
<style>
:root{--bg:#06080c;--card:#0c1017;--card2:#111723;--line:#1a2130;--line2:#2a3346;--txt:#e8edf5;--txt2:#c6cfdd;--mut:#8590a3;
  --acc:#34d399;--acct:var(--acc);--hd:rgba(6,8,12,.9);--inset:#05070a;--grid:rgba(255,255,255,.022);--sheet:#0b0f16;
  --win:#34d399;--lose:#f87171;--warn:#f5c542;--blue:#5aa9ff;--org:#fb923c;--pitch1:#14532d;--pitch2:#166534;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
html[data-th="light"]{--bg:#f3f5f9;--card:#ffffff;--card2:#eef1f6;--line:#dce2eb;--line2:#cfd6e2;--txt:#121826;--txt2:#333c4d;--mut:#5b6577;
  --acct:#0f8a5f;--hd:rgba(243,245,249,.93);--inset:#eef1f6;--grid:rgba(0,0,0,.035);--sheet:#ffffff;--win:#0f8a5f;--lose:#c2410c;--blue:#1d6fd6;--warn:#a16207}
html[data-th="light"] .card,html[data-th="light"] .lg,html[data-th="light"] .k{box-shadow:0 1px 3px rgba(16,24,40,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/26px 26px,radial-gradient(900px 420px at 80% -120px,color-mix(in srgb,var(--acc) 13%,transparent),transparent 70%),var(--bg);min-height:100vh}
body.noscroll{overflow:hidden}
a{color:var(--acct);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

/* Kopf */
header.top{position:sticky;top:0;z-index:30;background:var(--hd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.brand{font:800 15px var(--mono);letter-spacing:.5px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--acct)}.brand i{font-style:normal;color:var(--mut);font-weight:500}
@media (max-width:440px){.brand{font-size:13px;letter-spacing:0}.sbtn{width:34px}}
.sp{flex:1}
.sbtn{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;width:38px;height:36px;font-size:15px;display:grid;place-items:center}
.sbtn:hover{border-color:var(--acc)}
#q{display:none;flex:1;min-width:0;background:var(--card);border:1px solid var(--acc);color:var(--txt);border-radius:10px;padding:8px 12px;font:14px var(--mono);outline:none}
body.srch #q{display:block}body.srch .brand{display:none}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font:700 12px var(--mono);text-align:center;line-height:1.25;position:relative;color:var(--txt)}
.day small{display:block;color:var(--mut);font:500 10.5px var(--mono)}
.day.on{background:var(--acc);border-color:var(--acc);color:#04130c}
.day.on small{color:#04130c}
.day.none{opacity:.45}
.day.cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

main{padding:12px 0 30px}
.lb{font:700 10.5px var(--mono);letter-spacing:1px;color:var(--acct);text-transform:uppercase}
.kp{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px 0 10px}
.k{flex:1 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:11.5px;color:var(--mut);min-width:92px}
.k b{display:block;font:800 18px var(--mono);color:var(--acct)}
.seg{display:flex;gap:4px;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;white-space:nowrap;color:var(--mut);font:700 12px var(--mono);padding:8px 10px;border-radius:9px}
.seg button.on{background:var(--acc);color:#04130c}
.note{background:color-mix(in srgb,var(--acc) 8%,transparent);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.note.warn{background:color-mix(in srgb,var(--warn) 9%,transparent);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.ctry{margin:16px 2px 8px;font:700 10.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--mut);break-after:avoid}
.cols{columns:1;column-gap:12px}
@media (min-width:980px){.cols{columns:2}}
.lg{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;break-inside:avoid}
.lg:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--c,var(--acc));opacity:.85}
.lghead{display:flex;align-items:center;gap:8px;padding:9px 8px 8px 12px;background:var(--card2);border-bottom:1px solid var(--line)}
.lghead img{width:20px;height:20px;object-fit:contain}
.lgname{font:700 13.5px var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.lground{font:500 11px var(--mono);color:var(--mut);white-space:nowrap}
.star{font-size:16px;color:var(--mut);width:28px;height:28px;flex:0 0 auto}
.star.on{color:var(--warn)}
.coll{width:22px;color:var(--mut);flex:0 0 auto;font-size:12px}
.match{display:grid;grid-template-columns:54px 1fr auto 14px;gap:10px;align-items:center;padding:8px 10px 8px 12px;border-top:1px solid var(--line);cursor:pointer}
.match:first-of-type{border-top:0}
.match:hover{background:color-mix(in srgb,var(--acc) 5%,transparent)}
.mtime{font:600 11px var(--mono);color:var(--mut);text-align:center;line-height:1.3}
.mtime small{display:block;font-size:10px}
.mtime.fin{color:var(--txt2)}
.tline{display:flex;align-items:center;gap:8px;min-height:23px;min-width:0}
.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tline.win .tn{font-weight:700}
.tline.lose .tn{color:var(--mut)}
.mscore{display:grid;text-align:right;font:800 15px var(--mono);min-width:18px}
.mscore span{min-height:23px;display:flex;align-items:center;justify-content:flex-end}
.mscore .w{color:var(--acct)}
.mdet{font-size:12px;color:var(--mut);text-align:right}
.mdet.ok{color:var(--acct)}
.logo{width:20px;height:20px;object-fit:contain;flex:0 0 auto}
.ph{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:0 0 auto;line-height:1;font-family:var(--mono)}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
.skel{height:70px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:10px 0;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
footer{color:var(--mut);font:11.5px/1.7 var(--mono);text-align:center;padding:6px 14px 40px}
footer a{color:var(--mut);text-decoration:underline}

/* Detail-Fenster */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none}
#sheet.open{display:block}
.sheet{position:absolute;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (min-width:900px){.sheet{top:20px;bottom:20px;left:50%;right:auto;transform:translateX(-50%);width:min(900px,94vw);border-radius:18px;border:1px solid var(--line)}}
.shead{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:0 12px;height:52px;background:var(--hd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:6}
.back{font:700 13px var(--mono);color:var(--acct);white-space:nowrap}
.stitle{flex:1;min-width:0;text-align:center;font:700 13px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{margin:12px;padding:16px 12px 12px;text-align:center;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card) 60%);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:18px}
.lgl{font:600 11.5px var(--mono);color:var(--mut);display:inline-flex;justify-content:center;gap:6px;align-items:center}
.lgl img{width:16px;height:16px;object-fit:contain}
.hteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;margin-top:12px}
.hteam{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;line-height:1.25}
.hteam .logo,.hteam .ph{width:54px;height:54px}
.hscore{font:800 38px var(--mono);line-height:1.1;margin-top:6px;white-space:nowrap}
.hstatus{font:600 12px var(--mono);color:var(--mut);margin-top:4px}
.hsmall{font:500 11.5px var(--mono);color:var(--mut);margin-top:2px}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:12px;color:var(--mut);margin:12px 0 2px}
.scorers .l{text-align:right}.scorers .r{text-align:left}
.star.sm{font-size:15px;height:22px}
.tabs{display:flex;gap:4px;margin:0 12px;padding:4px;background:var(--inset);border:1px solid var(--line);border-radius:12px;overflow-x:auto;scrollbar-width:none;position:sticky;top:58px;z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;padding:8px 12px;border-radius:9px;font:700 12px var(--mono);white-space:nowrap;color:var(--mut)}
.tab.on{background:var(--acc);color:#04130c}
.pane{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 10px;font:700 10.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--acct)}
.ntxt{color:var(--mut);font-size:14px;text-align:center;padding:20px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--mut);font:600 12px var(--mono);padding-top:2px}

/* Ereignisse */
.ev{display:grid;grid-template-columns:1fr 46px 1fr;align-items:center;gap:6px;padding:7px 0;border-top:1px dashed var(--line);font-size:13.5px}
.ev:first-child{border-top:0}
.ev .m{text-align:center;font:700 12px var(--mono);color:var(--mut)}
.ev .l{text-align:right;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.ev .r{text-align:left;display:flex;align-items:center;gap:6px}
.ev .ic{flex:0 0 auto;white-space:nowrap}
.ev .sub{display:block;color:var(--mut);font-size:12px}
.ev .in{color:var(--win)}.ev .out{color:var(--lose)}
.ev .sc{display:inline-block;background:var(--acc);color:#04130c;border-radius:6px;padding:0 5px;font:800 12px var(--mono);margin:0 3px}
.evsep{text-align:center;font:700 11px var(--mono);color:var(--mut);padding:5px;background:var(--inset);border-radius:8px;margin:6px 0}
.card-y,.card-r{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;margin:0 1px}
.card-y{background:#f5c518}.card-r{background:#e5383b}

/* Aufstellung */
.teamlbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 12.5px var(--mono);max-width:520px;margin:0 auto 8px}
.teamlbl span:last-child{color:var(--mut)}
.pitch{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:68/105;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch1) 0 7.15%,var(--pitch2) 7.15% 14.3%)}
.pitch .ln{position:absolute;border:2px solid rgba(255,255,255,.3)}
.pl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:21%;text-align:center}
.shirt{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--mono);border:2px solid;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.pl .nm{font-size:10.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rt{position:absolute;top:-9px;right:-16px;font:700 9px var(--mono);padding:1px 3px;border-radius:4px;color:#fff;line-height:1.2}
.cap{position:absolute;top:-8px;left:-10px;font-size:9px;background:#fff;color:#111;border-radius:50%;width:13px;height:13px;display:grid;place-items:center;font-weight:800}
.pic{position:absolute;top:50%;right:calc(100% + 2px);transform:translateY(-50%);font-size:10px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.1}
.pic .card-y,.pic .card-r{width:8px;height:11px}
.bench{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:540px){.bench{grid-template-columns:1fr}}
.grp{font:700 11px var(--mono);color:var(--mut);margin:12px 0 4px}
.prow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.prow .no{width:22px;text-align:right;color:var(--mut);font:600 12px var(--mono)}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ps{font:600 10.5px var(--mono);color:var(--mut);width:24px}
.badge{font:700 11px var(--mono);padding:1px 5px;border-radius:5px;color:#fff}

/* Statistik */
.st{margin:12px 0}
.st .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.st .lab b{font-family:var(--mono)}
.st .lab span{color:var(--mut);font-size:12.5px}
.st .bars{display:flex;gap:4px;height:7px}
.st .bars>div{flex:1;border-radius:4px;background:var(--inset);border:1px solid var(--line);display:flex;overflow:hidden}
.st .bars>.h{justify-content:flex-end}
.st .bars i{display:block;height:100%}
.st .h i{background:var(--blue)}.st .a i{background:var(--org)}
.st .lab b.lead{color:var(--acct)}

/* Tabellen */
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:700 9.5px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);text-align:center;padding:6px 3px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 3px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.t,.tbl th.t{text-align:left}
.tcell{display:flex;align-items:center;gap:7px;min-width:0}
.tcell .tn{max-width:190px}
.tbl td.rk{width:30px;position:relative;font:800 12px var(--mono)}
.tbl td.rk::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:2px;background:var(--q,transparent)}
.tbl tr.hl td{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.tbl td.pts{font:800 13px var(--mono);color:var(--acct)}
.form{display:flex;gap:2px;justify-content:center}
.form i{width:15px;height:15px;border-radius:3px;font:700 9px var(--mono);font-style:normal;display:grid;place-items:center;color:#fff}
.form .W{background:#16a34a}.form .D{background:#7c8798}.form .L{background:#dc2626}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (max-width:560px){.tbl .xs{display:none}.tcell .tn{max-width:130px}}
.lhero{display:flex;align-items:center;gap:12px;margin:12px;padding:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card) 60%);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:18px}
.lhero img,.lhero .ph{width:48px;height:48px;object-fit:contain}
.lhero h2{margin:0;font:800 19px var(--mono)}
.lhero div div{font:500 12px var(--mono);color:var(--mut)}
.dsep{font:700 10.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--mut);padding:9px 12px 5px;background:var(--card2);border-top:1px solid var(--line)}
.dsep:first-child{border-top:0}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 13px;font:700 12.5px var(--mono)}
.btn:hover{border-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:9px 16px;border-radius:999px;font:600 13px var(--mono);z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar1">
      <div class="brand">⚽ <b>FUSSBALL</b><i>//ERGEBNISSE</i></div>
      <input id="q" type="search" placeholder="Team oder Liga suchen …" autocomplete="off">
      <span class="sp"></span>
      <button class="sbtn" id="sbtn" title="Suchen" aria-label="Suchen">🔎</button>
      <a class="sbtn" href="chronik/" title="Fußball-Chronik" aria-label="Fußball-Chronik">🏆</a>
      <button class="sbtn" id="tbtn" title="Hell / Dunkel" aria-label="Hell oder Dunkel">☀️</button>
    </div>
    <div class="days" id="days"></div>
  </div>
</header>

<main class="wrap">
  <div id="kp" class="kp"></div>
  <div class="seg" id="seg">
    <button class="on" data-filter="all">Alle</button>
    <button data-filter="de">Deutschland</button>
    <button data-filter="int">International</button>
    <button data-filter="fav">★ Favoriten</button>
  </div>
  <div id="msg"></div>
  <div id="list"></div>
</main>
<footer id="foot"></footer>

<div id="sheet" aria-hidden="true">
  <div class="sheet" id="sheetScroll">
    <div class="shead">
      <button class="back" id="back">‹ Zurück</button>
      <div class="stitle" id="sheetTitle"></div>
      <div style="width:60px"></div>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================================
   Bayazit Fußball-Ergebnisse
   Die Daten sammelt GitHub automatisch mehrmals am Tag (Ordner data/).
   Diese Seite liest nur gespeicherte Dateien → keine Abruf-Grenzen beim Anschauen.
   ===================================================================== */
const TZ = "Europe/Berlin";
const RELOAD_MIN = 10;   // alle 10 Minuten nachsehen, ob neue Ergebnisse gespeichert wurden

const COUNTRY_DE = {Germany:"Deutschland",World:"International & Europapokal",England:"England",Spain:"Spanien",Italy:"Italien",France:"Frankreich",Turkey:"Türkei","Türkiye":"Türkei",Netherlands:"Niederlande",Portugal:"Portugal",Austria:"Österreich",Switzerland:"Schweiz",Belgium:"Belgien",Scotland:"Schottland",Greece:"Griechenland",Denmark:"Dänemark",Poland:"Polen","Czech-Republic":"Tschechien",Croatia:"Kroatien",Sweden:"Schweden",Norway:"Norwegen",Brazil:"Brasilien",Argentina:"Argentinien",USA:"USA",Mexico:"Mexiko","Saudi-Arabia":"Saudi-Arabien",Japan:"Japan"};
const AREA_COLOR = {Germany:"#f5c542",World:"#5aa9ff"};

/* ---------------- Hilfen ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const DONE = new Set(["FT","AET","PEN","AWD","WO"]);
const LIVE = new Set(["1H","HT","2H","ET","BT","P","SUSP","INT","LIVE"]);
const isDone = f => DONE.has(f.fixture.status.short);
const notStarted = f => ["NS","TBD"].includes(f.fixture.status.short);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function ymd(d) { return new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"}).format(d); }
function todayStr() { return ymd(new Date()); }
function addDays(s, n) { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + n, 12)).toISOString().slice(0, 10); }
function weekday(s, long) { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString("de-DE", {weekday: long ? "long" : "short", timeZone: "UTC"}).replace(".", ""); }
function dLabel(s) { return `${s.slice(8, 10)}.${s.slice(5, 7)}.`; }
function dayName(s) { const t = todayStr(); return s === t ? "Heute" : s === addDays(t, -1) ? "Gestern" : s === addDays(t, 1) ? "Morgen" : weekday(s); }
function fmtTime(iso) { return new Date(iso).toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit", timeZone: TZ}); }
function fmtDate(iso, o) { return new Date(iso).toLocaleDateString("de-DE", Object.assign({timeZone: TZ}, o || {day: "2-digit", month: "2-digit", year: "numeric"})); }
function fmtStamp(iso) { if (!iso) return "–"; const d = new Date(iso); return `${fmtDate(iso, {day: "2-digit", month: "2-digit"})}, ${fmtTime(iso)} Uhr`; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function initials(name) { const p = String(name || "?").replace(/[^\p{L}\p{N} ]/gu, "").split(" ").filter(Boolean); return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); }
function logoHTML(obj, size) {
  size = size || 20;
  if (obj && obj.logo) return `<img class="logo" src="${esc(obj.logo)}" alt="" loading="lazy" style="width:${size}px;height:${size}px" onerror="this.style.visibility='hidden'">`;
  const h = hashStr((obj && obj.name) || "x") % 360;
  return `<span class="ph" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .38)}px;background:hsl(${h},40%,36%)">${esc(initials(obj && obj.name))}</span>`;
}
function countryOf(l) { return l.country === "Türkiye" ? "Turkey" : (l.country || "World"); }
function countryLabel(c) { return COUNTRY_DE[c] || c; }
function shortName(n) { const p = String(n || "").split(" "); if (p.length < 2) return n || ""; if (p[0].endsWith(".")) return p.slice(1).join(" "); return p[p.length - 1]; }
function ratingColor(r) { r = parseFloat(r); return r >= 8 ? "#15803d" : r >= 7.2 ? "#16a34a" : r >= 6.6 ? "#b8860b" : "#c2410c"; }
function minute(s) { return s.elapsed != null ? s.elapsed + (s.extra ? "+" + s.extra : "") + "'" : ""; }
let toastT;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600); }

const ROUND_MAP = {"Round of 16":"Achtelfinale","Round of 32":"Sechzehntelfinale","Quarter-finals":"Viertelfinale","Semi-finals":"Halbfinale","Final":"Finale","1st Round":"1. Runde","2nd Round":"2. Runde","3rd Round":"3. Runde","4th Round":"4. Runde","Knockout Round Play-offs":"Play-offs","Play-offs":"Play-offs","Relegation Round":"Relegation","3rd Place Final":"Spiel um Platz 3"};
function roundDe(r) {
  if (!r) return "";
  let m;
  if ((m = r.match(/^(Regular Season|League Stage|League Phase)\s*-\s*(\d+)/i))) return m[2] + ". Spieltag";
  if ((m = r.match(/^Group\s+(\w+)\s*-\s*(\d+)/i))) return "Gruppe " + m[1] + ", " + m[2] + ". Spieltag";
  if ((m = r.match(/^Group Stage\s*-\s*(\d+)/i))) return "Gruppenphase, " + m[1] + ". Spieltag";
  return ROUND_MAP[r] || r.replace("Round of", "Runde der letzten");
}
function statusShort(f) {

  switch (s.short) {
    case "FT": return "Ende";
    case "AET": return "n.V.";
    case "PEN": return "i.E.";
    case "AWD": return "Wertung";
    case "WO": return "kampfl.";
    case "PST": return "Verlegt";
    case "CANC": return "Abgesagt";
    case "ABD": return "Abgebr.";
    case "NS": case "TBD": return fmtTime(f.fixture.date);
    default: return LIVE.has(s.short) ? "läuft" : fmtTime(f.fixture.date);
  }
}
function statusLong(f) {
  const s = f.fixture.status, p = f.score && f.score.penalty;
  switch (s.short) {
    case "FT": return "Spielende";
    case "AET": return "Ende nach Verlängerung";
    case "PEN": return `Ende nach Elfmeterschießen${p && p.home != null ? ` (${p.home}:${p.away})` : ""}`;
    case "AWD": return "Am grünen Tisch gewertet";
    case "WO": return "Kampflos gewertet";
    case "PST": return "Spiel verlegt";
    case "CANC": return "Spiel abgesagt";
    case "ABD": return "Spiel abgebrochen";
    case "NS": case "TBD": return `Anstoß ${fmtDate(f.fixture.date, {weekday: "short", day: "2-digit", month: "2-digit"})}, ${fmtTime(f.fixture.date)} Uhr – Ergebnis folgt`;
    default: return "Spiel läuft – Ergebnis folgt nach Abpfiff";

}

const fileCache = new Map();
function bust() { return Math.floor(Date.now() / (RELOAD_MIN * 60e3)); }
async function getJSON(url, fresh) {
  const key = url;
  if (!fresh && fileCache.has(key)) return fileCache.get(key);
  const p = fetch(`${url}?v=${bust()}`, {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  fileCache.set(key, p);
  try { return await p; } catch (e) { fileCache.delete(key); throw e; }
}
const loadIndex = fresh => getJSON("data/index.json", fresh);
const loadDay = (d, fresh) => getJSON(`data/tage/${d}.json`, fresh);
const loadMatch = (id, d) => getJSON(`data/spiele/${d.slice(0, 7)}/${id}.json`);
const loadTable = id => getJSON(`data/tabellen/${id}.json`);

  collapsed: new Set(store.get("collapsed", [])),

};

/* ---------------- Tage ---------------- */
function availDays() { return state.index ? Object.keys(state.index.days).sort() : []; }
function renderDays() {
  const all = availDays(), t = todayStr();
  const set = new Set(all);
  // letzte 21 Tage bis heute, plus gewählter Tag
  const range = [];
  for (let i = -20; i <= 0; i++) range.push(addDays(t, i));
  if (state.date && !range.includes(state.date)) range.unshift(state.date);
  let h = "";
  for (const d of range) {
    const info = state.index && state.index.days[d];
    const cls = d === state.date ? " on" : (!set.has(d) || !info || !info.n ? " none" : "");
    h += `<button class="day${cls}" data-day="${d}">${dayName(d)}<small>${dLabel(d)}</small></button>`;
  }
  const min = all[0] || addDays(t, -30);
  h += `<label class="day cal" title="Datum wählen">📅<small>Datum</small><input type="date" id="datePick" value="${state.date || t}" min="${min}" max="${t}"></label>`;
  $("#days").innerHTML = h;
  const on = $("#days .day.on");
  if (on && on.scrollIntoView) on.scrollIntoView({inline: "center", block: "nearest"});
}
function pickDefaultDate() {
  const all = availDays(), t = todayStr();
  const fin = d => state.index.days[d] && state.index.days[d].f > 0;
  if (fin(t)) return t;
  for (let i = all.length - 1; i >= 0; i--) if (all[i] <= t && fin(all[i])) return all[i];
  return t;
}

/* ---------------- Liste ---------------- */
function rankOf(l) { return state.fav.leagues.has(l.id) ? -1e6 + (l.rank || 0) : (l.rank ?? 99999); }
function groupFixtures(list) {
  const by = new Map();
  for (const f of list) {
    if (!by.has(f.league.id)) by.set(f.league.id, {league: f.league, items: []});
    by.get(f.league.id).items.push(f);
  }
  const groups = [...by.values()];
  groups.forEach(g => g.items.sort((a, b) => a.fixture.timestamp - b.fixture.timestamp || a.teams.home.name.localeCompare(b.teams.home.name, "de")));
  groups.sort((a, b) => rankOf(a.league) - rankOf(b.league) || a.league.name.localeCompare(b.league.name, "de"));
  return groups;
}
function matchRow(f, opts) {
  opts = opts || {};
  const done = isDone(f);
  let hw = "", aw = "";
  if (done) {
    if (f.teams.home.winner === true) { hw = "win"; aw = "lose"; }
    else if (f.teams.away.winner === true) { aw = "win"; hw = "lose"; }
  }
  let time = statusShort(f);
  if (opts.showDate) time = `${fmtDate(f.fixture.date, {day: "2-digit", month: "2-digit"})}<small>${esc(statusShort(f))}</small>`;
  else if (f.fixture.status.short === "PEN" && f.score.penalty) time += `<small>${f.score.penalty.home}:${f.score.penalty.away}</small>`;
  else if (done) time += `<small>${fmtTime(f.fixture.date)}</small>`;
  const gh = f.goals.home, ga = f.goals.away;
  const det = f._d ? '<span class="mdet ok" title="Alle Details gespeichert">›</span>' : (done ? '<span class="mdet" title="Details folgen">·</span>' : '<span class="mdet"></span>');
  const day = opts.day || state.date;
  return `<div class="match" data-match="${f.fixture.id}" data-mday="${day}">
    <div class="mtime${done ? " fin" : ""}">${time}</div>
    <div>
      <div class="tline ${hw}">${logoHTML(f.teams.home)}<span class="tn">${esc(f.teams.home.name)}</span></div>
      <div class="tline ${aw}">${logoHTML(f.teams.away)}<span class="tn">${esc(f.teams.away.name)}</span></div>
    </div>
    <div class="mscore"><span class="${hw === "win" ? "w" : ""}">${done || gh != null ? (gh ?? "") : "–"}</span><span class="${aw === "win" ? "w" : ""}">${done || ga != null ? (ga ?? "") : "–"}</span></div>
    ${det}
  </div>`;
}
function leagueBlock(g) {
  const l = g.league;
  const col = state.collapsed.has(l.id) && !state.q;
  const fav = state.fav.leagues.has(l.id);
  const c = AREA_COLOR[countryOf(l)] || "var(--acc)";
  return `<section class="lg" style="--c:${c}">
    <div class="lghead">${l.logo ? `<img src="${esc(l.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : logoHTML(l, 20)}

}
function renderKP(list) {
  const fin = list.filter(isDone).length, det = list.filter(f => f._d).length;
  const leagues = new Set(list.map(f => f.league.id)).size;
  const goals = list.filter(isDone).reduce((s, f) => s + (f.goals.home || 0) + (f.goals.away || 0), 0);
  $("#kp").innerHTML = list.length ? `
    <div class="k"><b>${fin}</b>Ergebnisse</div>
    <div class="k"><b>${det}</b>mit allen Details</div>
    <div class="k"><b>${leagues}</b>Wettbewerbe</div>
    <div class="k"><b>${goals}</b>Tore</div>` : "";
}
function renderList() {
  const root = $("#list");
  document.querySelectorAll("[data-filter]").forEach(b => b.classList.toggle("on", b.dataset.filter === state.filter));
  if (!state.index) { root.innerHTML = '<div class="skel"></div>'.repeat(5); return; }
  let msg = "";
  if (!availDays().length) msg += `<div class="note"><b>Die Sammlung startet gerade.</b> GitHub holt die Ergebnisse mehrmals am Tag automatisch ab. Die ersten Spiele erscheinen nach dem nächsten Abruf.</div>`;
  if (state.day === undefined) { $("#msg").innerHTML = msg; root.innerHTML = '<div class="skel"></div>'.repeat(4); $("#kp").innerHTML = ""; return; }
  if (state.day === null) {
    $("#msg").innerHTML = msg; $("#kp").innerHTML = "";
    const t = todayStr();
    root.innerHTML = `<div class="empty">${state.date > t ? "Für diesen Tag gibt es noch keine Ergebnisse." : state.date < (availDays()[0] || t) ? "Dieser Tag ist noch nicht gesammelt. Ältere Spieltage werden nach und nach automatisch nachgeholt." : "Für diesen Tag wurden noch keine Spiele gespeichert."}</div>`;
    return;
  }
  let list = state.day.fixtures;
  const open = list.filter(f => isDone(f) && !f._d).length;
  const upcoming = list.filter(f => !isDone(f) && !["PST", "CANC", "ABD"].includes(f.fixture.status.short)).length;
  if (open) msg += `<div class="note warn">Bei ${open} beendeten Spielen werden Aufstellung und Statistik beim nächsten automatischen Abruf nachgeladen.</div>`;
  else if (upcoming && state.date === todayStr()) msg += `<div class="note">${upcoming} Spiele heute sind noch nicht beendet – ihre Ergebnisse kommen nach Abpfiff beim nächsten Abruf.</div>`;
  $("#msg").innerHTML = msg;
  renderKP(list);
  if (state.filter === "de") list = list.filter(f => countryOf(f.league) === "Germany");
  if (state.filter === "int") list = list.filter(f => countryOf(f.league) !== "Germany");
  if (state.filter === "fav") list = list.filter(f => state.fav.leagues.has(f.league.id) || state.fav.teams.has(f.teams.home.id) || state.fav.teams.has(f.teams.away.id));
  if (state.q) {
    const q = norm(state.q);
    list = list.filter(f => norm(f.teams.home.name).includes(q) || norm(f.teams.away.name).includes(q) || norm(f.league.name).includes(q));
  }
  if (!list.length) {
    const why = state.filter === "fav" ? "Keine Spiele deiner Favoriten an diesem Tag. Markiere Ligen mit ☆ oder Teams in der Spielansicht." : state.q ? "Nichts gefunden." : "An diesem Tag gibt es keine Spiele in dieser Auswahl.";
    root.innerHTML = `<div class="empty">${why}</div>`;
    return;
  }
  let html = "", last = null, opened = false;
  for (const g of groupFixtures(list)) {
    const sec = state.fav.leagues.has(g.league.id) ? "★ Favoriten" : countryLabel(countryOf(g.league));
    if (sec !== last) {
      if (opened) html += "</div>";
      html += `<div class="ctry">${esc(sec)}</div><div class="cols">`;

function renderFoot() {

async function loadIndexAndDay(fresh) {
  try { state.index = await loadIndex(fresh); }
  catch (e) { state.index = {days: {}, tables: {}}; }
  if (!state.date) state.date = pickDefaultDate();

async function showDay(d, fresh) {
  state.date = d;

  const has = state.index && state.index.days[d];
  if (!has) { state.day = null; renderList(); return; }
  state.day = undefined; renderList();
  try { const day = await loadDay(d, fresh); if (state.date === d) state.day = day; }

/* ---------------- Detail-Fenster ---------------- */
function showSheet() { $("#sheet").classList.add("open"); document.body.classList.add("noscroll"); }
function closeSheet() { $("#sheet").classList.remove("open"); document.body.classList.remove("noscroll"); state.match = null; state.detail = null; state.league = null; $("#sheetBody").innerHTML = ""; }
function setSheet(html, title) { $("#sheetBody").innerHTML = html; $("#sheetTitle").textContent = title || ""; }

async function findFixture(id, d) {
  try { const day = await loadDay(d); return day.fixtures.find(f => f.fixture.id === id) || null; } catch (e) { return null; }
}
async function openMatch(id, d) {
  showSheet();

  setSheet('<div class="ntxt">Lade Spiel …</div>', "Spiel");

function goalsBySide(f, det) {
  const out = {home: [], away: []};
  for (const e of (det && det.events) || []) {
    if (e.type !== "Goal" || e.detail === "Missed Penalty") continue;
    const side = e.team && e.team.id === f.teams.home.id ? "home" : "away";
    const extra = e.detail === "Own Goal" ? " (ET)" : e.detail === "Penalty" ? " (11m)" : "";
    out[side].push({name: shortName(e.player && e.player.name), min: e.time.elapsed + (e.time.extra ? "+" + e.time.extra : "") + "'" + extra});
  }
  const fmt = arr => {
    const m = new Map();
    arr.forEach(g => { if (!m.has(g.name)) m.set(g.name, []); m.get(g.name).push(g.min); });
    return [...m].map(([n, mins]) => `${esc(n)} ${mins.join(", ")}`).join("<br>");
  };
  return {home: fmt(out.home), away: fmt(out.away)};
}

  };

  setSheet(`
    <div class="hero">
      <a class="lgl" href="#/liga/${L.id}">${L.logo ? `<img src="${esc(L.logo)}" alt="" onerror="this.style.display='none'">` : ""}${esc(L.name)}${L.round ? " · " + esc(roundDe(L.round)) : ""}</a>
      <div class="hteams">
        ${team("home")}

    <div class="pane" id="mpane"></div>`, `${f.teams.home.name} – ${f.teams.away.name}`);
  renderMatchPane();
}
function noDetailNote(f) {

const VAR_DE = {"Goal cancelled":"Tor aberkannt","Goal Disallowed":"Tor aberkannt","Goal Disallowed - offside":"Tor aberkannt – Abseits","Goal Disallowed - handball":"Tor aberkannt – Handspiel","Goal Disallowed - Foul":"Tor aberkannt – Foul","Goal confirmed":"Tor bestätigt","Penalty confirmed":"Elfmeter bestätigt","Penalty cancelled":"Elfmeter zurückgenommen","Card upgrade":"Karte geändert","Red card cancelled":"Rote Karte zurückgenommen"};
const REASON_DE = {"Foul":"Foul","Argument":"Meckern","Time wasting":"Zeitspiel","Handball":"Handspiel","Unsportsmanlike conduct":"Unsportlichkeit","Professional foul last man":"Notbremse","Violent conduct":"Tätlichkeit","Simulation":"Schwalbe","Roughing":"Grobes Foulspiel","Holding":"Halten","Tripping":"Beinstellen","Off the ball foul":"Foul ohne Ball","Dangerous play":"Gefährliches Spiel","Delay of game":"Spielverzögerung","Persistent fouling":"Wiederholtes Foulspiel","Entering field":"Unerlaubtes Betreten","Leaving field":"Unerlaubtes Verlassen","Bench":"Bank"};
function cardIcon(d) {
  d = d || "";

function infoCard(f) {
  const fx = f.fixture, sc = f.score || {};
  const info = [];
  info.push(["Anstoß", `${fmtDate(fx.date, {weekday: "long", day: "2-digit", month: "2-digit", year: "numeric"})}, ${fmtTime(fx.date)} Uhr`]);
  if (f.league.round) info.push(["Runde", roundDe(f.league.round)]);
  if (fx.venue && fx.venue.name) info.push(["Stadion", fx.venue.name + (fx.venue.city ? ", " + fx.venue.city : "")]);
  if (fx.referee) info.push(["Schiedsrichter", fx.referee]);
  if (sc.halftime && sc.halftime.home != null) info.push(["Halbzeit", `${sc.halftime.home}:${sc.halftime.away}`]);
  if (sc.fulltime && sc.fulltime.home != null && (sc.extratime && sc.extratime.home != null)) info.push(["Nach 90 Min.", `${sc.fulltime.home}:${sc.fulltime.away}`]);
  if (sc.extratime && sc.extratime.home != null) info.push(["Verlängerung", `${sc.extratime.home}:${sc.extratime.away}`]);
  if (sc.penalty && sc.penalty.home != null) info.push(["Elfmeterschießen", `${sc.penalty.home}:${sc.penalty.away}`]);
  return `<div class="card"><h3>Spielinfo</h3><div class="kv">${info.map(([k, v]) => `<span>${esc(k)}</span><span>${esc(v)}</span>`).join("")}</div></div>`;
}
function paneOverview(f, det) {
  let evs = (det.events || []).map((e, i) => ({...e, _i: i}));
  evs.sort((a, b) => (a.time.elapsed - b.time.elapsed) || ((a.time.extra || 0) - (b.time.extra || 0)) || a._i - b._i);
  const run = {h: 0, a: 0};
  evs.forEach(e => {
    if (e.type === "Goal" && e.detail !== "Missed Penalty") {
      if (e.team && e.team.id === f.teams.home.id) run.h++; else run.a++;
      e._score = `${run.h}:${run.a}`;
    }
  });
  let rows = "", lastHalf = null;
  for (const e of evs) {
    const half = e.time.elapsed <= 45 ? 1 : e.time.elapsed <= 90 ? 2 : e.time.elapsed <= 120 ? 3 : 4;
    if (lastHalf !== null && half !== lastHalf) rows += `<div class="evsep">${half === 2 ? "Halbzeit" : half === 3 ? "Verlängerung" : "Elfmeterschießen"}</div>`;
    lastHalf = half;
    const home = e.team && e.team.id === f.teams.home.id;
    let icon = "", main = esc(e.player && e.player.name), sub = "";
    const d = e.detail || "";
    if (e.type === "Goal") {
      if (d === "Missed Penalty") { icon = "❌"; sub = "Elfmeter verschossen"; }
      else {
        icon = `⚽<span class="sc">${e._score}</span>`;
        const parts = [];
        if (d === "Own Goal") parts.push("Eigentor");
        if (d === "Penalty") parts.push("Elfmeter");
        if (e.assist && e.assist.name) parts.push("Vorlage: " + esc(e.assist.name));
        sub = parts.join(" · ");
      }
    } else if (e.type === "Card") {
      icon = cardIcon(d);
      if (e.comments) sub = esc(REASON_DE[e.comments] || e.comments);
    } else if (e.type === "subst") {
      icon = "⇄";
      main = `<span class="in">↑ ${esc(e.assist && e.assist.name)}</span>`;
      sub = `<span class="out">↓ ${esc(e.player && e.player.name)}</span>`;
    } else if (e.type === "Var") {
      icon = "📺";
      main = "VAR: " + esc(VAR_DE[d] || d);
      sub = esc(e.player && e.player.name);
    } else { main = esc(d || e.type); }
    const content = `<span>${main}${sub ? `<span class="sub">${sub}</span>` : ""}</span>`;
    const min = e.time.elapsed + (e.time.extra ? "+" + e.time.extra : "") + "'";
    rows += home
      ? `<div class="ev"><div class="l">${content}<span class="ic">${icon}</span></div><div class="m">${min}</div><div class="r"></div></div>`
      : `<div class="ev"><div class="l"></div><div class="m">${min}</div><div class="r"><span class="ic">${icon}</span>${content}</div></div>`;
  }
  return `${rows ? `<div class="card"><h3>Spielverlauf</h3>${rows}</div>` : '<div class="card"><div class="ntxt">Für dieses Spiel liefert die Datenquelle keinen Spielverlauf.</div></div>'}${infoCard(f)}`;
}

function playerMaps(det) {
  const stats = new Map(), ev = new Map();
  for (const t of det.players || []) for (const p of t.players || []) stats.set(p.player.id, p.statistics && p.statistics[0]);
  const get = id => { if (!ev.has(id)) ev.set(id, {g: 0, og: 0, y: 0, r: 0, out: null, in: null}); return ev.get(id); };
  for (const e of det.events || []) {
    const pid = e.player && e.player.id, d = e.detail || "";
    if (!pid) continue;
    if (e.type === "Goal" && d !== "Missed Penalty") { if (d === "Own Goal") get(pid).og++; else get(pid).g++; }
    if (e.type === "Card") { if (d.startsWith("Yellow")) get(pid).y++; else get(pid).r++; }
    if (e.type === "subst") { get(pid).out = e.time.elapsed; if (e.assist && e.assist.id) get(e.assist.id).in = e.time.elapsed; }
  }
  return {stats, ev};
}
function teamColors(lu, home) {
  const c = (lu.team && lu.team.colors) || {};
  const pick = (o, d) => ({primary: "#" + ((o && o.primary) || d[0]), number: "#" + ((o && o.number) || d[1]), border: "#" + ((o && o.border) || d[2])});
  return {pl: pick(c.player, home ? ["2563eb", "ffffff", "1e40af"] : ["e2e8f0", "1a202c", "94a3b8"]), gk: pick(c.goalkeeper, ["15803d", "ffffff", "14532d"])};
}
function plMarker(p, x, y, colors, maps) {
  const col = p.pos === "G" ? colors.gk : colors.pl;
  const st = maps.stats.get(p.id), ev = maps.ev.get(p.id) || {};
  const rating = st && st.games && st.games.rating;
  const cap = st && st.games && st.games.captain;
  let ic = "";
  if (ev.g) ic += "⚽".repeat(Math.min(ev.g, 3));
  if (ev.og) ic += "⚽ᴱᵀ";
  if (ev.r) ic += '<span class="card-r"></span>'; else if (ev.y) ic += '<span class="card-y"></span>';
  if (ev.out != null) ic += `<span style="color:#fca5a5">▼${ev.out}'</span>`;
  return `<div class="pl" style="left:${x}%;top:${y}%">
    <div class="shirt" style="background:${col.primary};color:${col.number};border-color:${col.border}">${esc(p.number ?? "")}
      ${rating ? `<span class="rt" style="background:${ratingColor(rating)}">${parseFloat(rating).toFixed(1)}</span>` : ""}
      ${cap ? '<span class="cap">C</span>' : ""}
      ${ic ? `<span class="pic">${ic}</span>` : ""}</div>
    <div class="nm">${esc(shortName(p.name))}</div></div>`;
}
function pitchPlayers(lu, isHome, maps) {
  const xi = (lu.startXI || []).map(x => x.player);
  if (!xi.length || !xi.every(p => p.grid)) return null;
  const rows = {};
  for (const p of xi) { const [r, c] = p.grid.split(":").map(Number); (rows[r] = rows[r] || []).push({p, c}); }
  const R = Math.max(...Object.keys(rows).map(Number));
  const colors = teamColors(lu, isHome);
  let out = "";
  for (const [rs, arr] of Object.entries(rows)) {
    const r = Number(rs);
    arr.sort((a, b) => a.c - b.c);
    arr.forEach((o, i) => {
      let x = (i + 1) / (arr.length + 1) * 100;
      let y = R > 1 ? 7.5 + (r - 1) * (35 / (R - 1)) : 25;
      if (!isHome) { y = 100 - y; x = 100 - x; }
      out += plMarker(o.p, x, y, colors, maps);
    });
  }
  return out;
}
const POS_DE = {G: "TW", D: "AB", M: "MF", F: "ST"};
function playerList(arr, maps, isSub) {
  return arr.map(x => {

    return `<div class="prow"><span class="no">${esc(p.number ?? "")}</span><span class="ps">${POS_DE[p.pos] || ""}</span><span class="nm">${esc(p.name)}${ic}</span>${r ? `<span class="badge" style="background:${ratingColor(r)}">${parseFloat(r).toFixed(1)}</span>` : ""}</div>`;
  }).join("");
}

const STAT_DE = {"expected_goals":"Expected Goals (xG)","Ball Possession":"Ballbesitz","Total Shots":"Torschüsse gesamt","Shots on Goal":"Schüsse aufs Tor","Shots off Goal":"Schüsse neben das Tor","Blocked Shots":"Geblockte Schüsse","Shots insidebox":"Schüsse im Strafraum","Shots outsidebox":"Schüsse außerhalb","Corner Kicks":"Ecken","Offsides":"Abseits","Fouls":"Fouls","Yellow Cards":"Gelbe Karten","Red Cards":"Rote Karten","Goalkeeper Saves":"Paraden","Total passes":"Pässe gesamt","Passes accurate":"Angekommene Pässe","Passes %":"Passquote","goals_prevented":"Verhinderte Gegentore"};
const STAT_ORDER = Object.keys(STAT_DE);
function paneStats(f, det) {
  const s = det.statistics || [];
  let html = "";
  if (s.length >= 2) {
    const H = s.find(x => x.team.id === f.teams.home.id) || s[0];
    const A = s.find(x => x.team.id === f.teams.away.id) || s[1];
    const types = [...new Set([...H.statistics.map(x => x.type), ...A.statistics.map(x => x.type)])];
    types.sort((a, b) => { const ia = STAT_ORDER.indexOf(a), ib = STAT_ORDER.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    const val = (T, t) => { const x = T.statistics.find(y => y.type === t); return x ? x.value : null; };
    const num = v => v == null ? 0 : parseFloat(String(v).replace("%", "")) || 0;
    let rows = "";
    for (const t of types) {
      const hv = val(H, t), av = val(A, t);
      if (hv == null && av == null) continue;
      const hn = num(hv), an = num(av), tot = hn + an || 1;
      rows += `<div class="st"><div class="lab"><b class="${hn > an ? "lead" : ""}">${esc(hv ?? 0)}</b><span>${esc(STAT_DE[t] || t)}</span><b class="${an > hn ? "lead" : ""}">${esc(av ?? 0)}</b></div>
        <div class="bars"><div class="h"><i style="width:${hn / tot * 100}%"></i></div><div class="a"><i style="width:${an / tot * 100}%"></i></div></div></div>`;
    }
    html += `<div class="card"><div class="teamlbl" style="max-width:none"><span style="color:var(--blue)">${esc(f.teams.home.name)}</span><span style="color:var(--org)">${esc(f.teams.away.name)}</span></div>${rows}</div>`;
  } else html += `<div class="card"><div class="ntxt">Für dieses Spiel liefert die Datenquelle keine Statistik.</div></div>`;
  const best = [];
  for (const t of det.players || []) for (const p of t.players || []) {
    const st = p.statistics && p.statistics[0];
    if (st && st.games && st.games.rating) best.push({p: p.player, team: t.team, st});
  }
  best.sort((a, b) => parseFloat(b.st.games.rating) - parseFloat(a.st.games.rating));
  if (best.length) {
    html += `<div class="card"><h3>Beste Spieler (Note)</h3>${best.slice(0, 10).map(b => `<div class="prow">${logoHTML(b.team, 18)}<span class="nm">${esc(b.p.name)}${b.st.goals && b.st.goals.total ? " ⚽".repeat(b.st.goals.total) : ""}${b.st.goals && b.st.goals.assists ? ` <span style="color:var(--mut);font-size:12px">${b.st.goals.assists} Vorl.</span>` : ""}</span><span class="badge" style="background:${ratingColor(b.st.games.rating)}">${parseFloat(b.st.games.rating).toFixed(1)}</span></div>`).join("")}</div>`;
  }
  return html;
}

function qualColor(desc) {
  const d = String(desc || "").toLowerCase();
  if (!d) return "";
  if (d.includes("champions league")) return d.includes("play") ? "#5b9bea" : "#1f6fd1";
  if (d.includes("europa league")) return "#f39c12";
  if (d.includes("conference")) return "#16a085";
  if (d.startsWith("relegation -") || d === "relegation" || d.includes("abstieg")) return "#d64545";
  if (d.includes("relegation") || d.includes("play")) return "#e67e22";
  if (d.startsWith("promotion") || d.includes("next round")) return "#1e9e4a";
  return "#8a94a3";
}
const DESC_DE = s => String(s || "").replace("Promotion - ", "").replace("Relegation - ", "Abstieg: ").replace("(League phase: )", "(Ligaphase)").replace("(Qualification: )", "(Qualifikation)").replace(/\(Play Offs?:?\s*\)/i, "(Play-offs)");
const FORM_DE = {W: "S", D: "U", L: "N"};
function standingsHTML(groups, hl) {

    for (const r of g) {

  return html;

async function paneTable(f, el) {

async function openLeague(id) {
  showSheet();

  $("#sheetScroll").scrollTop = 0;
  // Liga-Infos aus dem aktuellen Tag oder der Tabelle holen
  let info = null;
  const f = state.day && state.day.fixtures && state.day.fixtures.find(x => x.league.id === id);
  if (f) info = f.league;
  if (!info && state.index.tables && state.index.tables[id]) { try { const t = await loadTable(id); info = Object.assign({}, t.league); } catch (e) {} }
  if (!info) { const g = await leagueGames(id, 30); if (g.length) info = g[0].f.league; }
  if (state.route.type !== "league" || state.route.id !== id) return;
  state.league = {id, info: info || {id, name: "Wettbewerb"}};
  renderLeague();

async function leagueGames(id, maxDays) {
  const days = availDays().slice(-maxDays).reverse();
  const out = [];

  out.sort((a, b) => b.f.fixture.timestamp - a.f.fixture.timestamp);
  return out;
}

async function renderLeaguePane() {

  const still = () => state.league && state.league.id === L.id && state.leagueTab === tab;
  if (tab === "table") {
    if (!state.index.tables || !state.index.tables[L.id]) { el.innerHTML = `<div class="card"><div class="ntxt">Für diesen Wettbewerb ist keine Tabelle gespeichert.</div></div>`; return; }
    try {
      const t = await loadTable(L.id);
      if (still()) el.innerHTML = `<div class="card">${standingsHTML(t.standings, [...state.fav.teams])}<div class="legend">Stand: ${fmtStamp(t.updated)}</div></div>`;
    } catch (e) { if (still()) el.innerHTML = `<div class="card"><div class="ntxt">Tabelle konnte nicht geladen werden.</div></div>`; }
  } else {
    const games = await leagueGames(L.id, 60);
    if (!still()) return;
    if (!games.length) { el.innerHTML = `<div class="card"><div class="ntxt">Noch keine Spiele gespeichert.</div></div>`; return; }
    let h = '<div class="lg">', lastRound = null;
    for (const g of games) {
      const r = roundDe(g.f.league.round) || "";
      if (r !== lastRound) { h += `<div class="dsep">${esc(r || "Spiele")}</div>`; lastRound = r; }
      h += matchRow(g.f, {showDate: true, day: g.d});
    }
    el.innerHTML = h + "</div>";
  }
}

/* ---------------- Navigation ---------------- */
function route() {
  const h = location.hash;
  let m;
  if ((m = h.match(/^#\/spiel\/(\d{4}-\d{2}-\d{2})\/(\d+)/))) { state.route = {type: "match", id: Number(m[2])}; openMatch(Number(m[2]), m[1]); }
  else if ((m = h.match(/^#\/liga\/(\d+)/))) { state.route = {type: "league", id: Number(m[1])}; openLeague(Number(m[1])); }
  else { state.route = {type: "list"}; closeSheet(); state.navDepth = 0; }
}
function go(hash) { state.navDepth++; location.hash = hash; }
window.addEventListener("hashchange", route);
$("#back").addEventListener("click", () => { if (state.navDepth > 0) { state.navDepth--; history.back(); } else location.hash = "#/"; });

document.addEventListener("click", e => {
  const t = e.target.closest("[data-day],[data-filter],[data-fav-league],[data-fav-team],[data-coll],[data-match],[data-mtab],[data-ltab],a[href^='#/']");
  if (!t) return;
  if (t.dataset.day) { showDay(t.dataset.day); return; }
  if (t.dataset.filter) { state.filter = t.dataset.filter; store.set("fe_filter", state.filter); renderList(); return; }
  if (t.dataset.favLeague) {
    e.preventDefault(); e.stopPropagation();
    const id = Number(t.dataset.favLeague);
    state.fav.leagues.has(id) ? state.fav.leagues.delete(id) : state.fav.leagues.add(id);
    saveFav(); renderList(); if (state.league && state.league.info) renderLeague();
    toast(state.fav.leagues.has(id) ? "Liga als Favorit gespeichert" : "Favorit entfernt"); return;
  }
  if (t.dataset.favTeam) {
    e.stopPropagation();
    const id = Number(t.dataset.favTeam);
    state.fav.teams.has(id) ? state.fav.teams.delete(id) : state.fav.teams.add(id);
    saveFav(); renderMatch(); renderList();
    toast(state.fav.teams.has(id) ? "Team als Favorit gespeichert" : "Favorit entfernt"); return;
  }
  if (t.dataset.coll) {
    const id = Number(t.dataset.coll);
    state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
    store.set("collapsed", [...state.collapsed]); renderList(); return;
  }
  if (t.dataset.match) { go(`#/spiel/${t.dataset.mday}/${t.dataset.match}`); return; }
  if (t.dataset.mtab) {
    state.matchTab = t.dataset.mtab;
    document.querySelectorAll("[data-mtab]").forEach(b => b.classList.toggle("on", b === t));
    renderMatchPane(); return;
  }
  if (t.dataset.ltab) {
    state.leagueTab = t.dataset.ltab;
    document.querySelectorAll("[data-ltab]").forEach(b => b.classList.toggle("on", b === t));
    $("#lpane").innerHTML = '<div class="ntxt">Lade …</div>';
    renderLeaguePane(); return;
  }
  if (t.matches("a[href^='#/']")) { e.preventDefault(); go(t.getAttribute("href")); }
});
document.addEventListener("change", e => { if (e.target.id === "datePick" && e.target.value) showDay(e.target.value); });
let qT;
$("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value.trim(); renderList(); }, 150); });
$("#sbtn").addEventListener("click", () => {
  const on = document.body.classList.toggle("srch");
  if (on) $("#q").focus(); else { $("#q").value = ""; state.q = ""; renderList(); }
});
function applyTheme() { const light = document.documentElement.dataset.th === "light"; $("#tbtn").textContent = light ? "🌙" : "☀️"; document.querySelector('meta[name="theme-color"]').content = light ? "#f3f5f9" : "#06080c"; }
$("#tbtn").addEventListener("click", () => {
  const light = document.documentElement.dataset.th !== "light";
  if (light) document.documentElement.dataset.th = "light"; else delete document.documentElement.dataset.th;
  try { localStorage.setItem("fe_theme", light ? "light" : "dark"); } catch (e) {}
  applyTheme();
});

/* ---------------- Start ---------------- */
applyTheme();
renderList();
loadIndexAndDay(false).then(route);
// regelmäßig nachsehen, ob GitHub neue Ergebnisse gespeichert hat
setInterval(async () => {
  if (document.hidden) return;
  const old = state.index && state.index.updated;
  try {
    const ix = await loadIndex(true);
    if (ix.updated !== old) {
      state.index = ix; fileCache.clear(); fileCache.set("data/index.json", Promise.resolve(ix));
      renderDays(); renderFoot();
      if (state.route.type === "list") showDay(state.date, true);
    }
  } catch (e) {}
}, RELOAD_MIN * 60e3);
</script>
</body>
</html>
